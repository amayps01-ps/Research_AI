<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ResearchAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="navbar">
    <a class="logo" href="/">ResearchAI</a>
    <nav><a href="/">Home</a></nav>
</header>

<main class="auth-wrapper">
    <div class="auth-card">
        <h1>Reset Password</h1>
        <p>Create a new password for your account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>New Password</label>
            <input type="password" name="password" placeholder="Enter new password" minlength="8" required>

            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" placeholder="Confirm new password" minlength="8" required>

            <button type="submit" class="primary-button full-button">Reset Password</button>
        </form>
    </div>
</main>

</body>
</html>
